# CI: roda os testes do backend (pytest) e do frontend (vitest + build) a cada push.
# Não bloqueia o auto-deploy da Vercel/Render — serve como alarme: se ficar
# vermelho no GitHub, o push tinha problema.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instala dependências
        run: pip install -r backend/requirements.txt pytest
      - name: Testes
        working-directory: backend
        run: python -m pytest
      - name: Auditoria de dependências (não bloqueante)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  # A suíte roda em SQLite por padrão (rápido), mas produção é Postgres. Este job
  # repete os MESMOS testes contra um Postgres real para pegar diferenças de
  # dialeto — foi assim que passou batido um SUM(EXTRACT(epoch ...)) que devolve
  # Decimal no Postgres e float no SQLite, estourando 500 no /flights/stats.
  backend-postgres:
    name: Backend (pytest no Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flightlog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instala dependências
        run: pip install -r backend/requirements.txt pytest
      - name: Testes (dialeto Postgres)
        working-directory: backend
        run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flightlog_test

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm install (não "ci"): o lockfile é gerado no Windows e o npm tem um bug
      # conhecido com dependências nativas opcionais (binários do Rollup) que faz
      # o "npm ci" estrito falhar em Linux.
      - name: Instala dependências
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Testes
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Auditoria de dependências (não bloqueante)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev
